<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Vision Demo - Real-time Object Detection</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
            background: linear-gradient(45deg, #fff, #f0f8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 1.2rem;
            font-weight: 300;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 40px;
        }

        .video-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .video-container {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            background: #000;
        }

        #videoFeed {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 20px;
        }

        .video-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            backdrop-filter: blur(10px);
        }

        .controls-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .control-group {
            margin-bottom: 25px;
        }

        .control-group label {
            display: block;
            font-weight: 600;
            color: white;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .control-group input,
        .control-group textarea,
        .control-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .control-group input:focus,
        .control-group textarea:focus,
        .control-group select:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .control-group input::placeholder,
        .control-group textarea::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .control-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .button-container {
            text-align: center;
            margin-top: 30px;
        }

        #startButton {
            padding: 16px 40px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        #startButton::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        #startButton:hover::before {
            left: 100%;
        }

        #startButton.start {
            background: linear-gradient(45deg, #00d4aa, #00b894);
        }

        #startButton.start:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0, 212, 170, 0.4);
        }

        #startButton.stop {
            background: linear-gradient(45deg, #ff6b6b, #ee5a52);
        }

        #startButton.stop:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(255, 107, 107, 0.4);
        }

        .interval-control {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .interval-control select {
            width: auto;
            min-width: 120px;
        }



        .response-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .response-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            color: white;
        }

        .response-header h3 {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .latency-badge {
            margin-left: auto;
            background: rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.9);
            font-size: 0.8rem;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 500;
        }

        .ai-icon {
            width: 24px;
            height: 24px;
            background: linear-gradient(45deg, #00d4aa, #00b894);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        #responseText {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-family: 'Inter', monospace;
            line-height: 1.6;
            padding: 12px 16px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            width: 100%;
            min-height: 120px;
            resize: vertical;
        }

        #responseText:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .hidden {
            display: none;
        }

        .floating-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .floating-element {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        .floating-element:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .floating-element:nth-child(2) {
            width: 120px;
            height: 120px;
            top: 60%;
            right: 15%;
            animation-delay: 2s;
        }

        .floating-element:nth-child(3) {
            width: 60px;
            height: 60px;
            bottom: 20%;
            left: 20%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .header h1 {
                font-size: 2.5rem;
            }
            
            .container {
                padding: 15px;
            }
        }


    </style>
</head>
<body>
    <div class="floating-elements">
        <div class="floating-element"></div>
        <div class="floating-element"></div>
        <div class="floating-element"></div>
    </div>

    <div class="container">
        <div class="header">
            <h1>Vision Language Model Demo</h1>
            <p>Image understanding powered by natural language intelligence</p>
        </div>

        <div class="main-content">
            <div class="video-section">
                <div class="video-container">
                    <video id="videoFeed" autoplay playsinline></video>
                    <div class="video-overlay" id="videoStatus">Camera Ready</div>
                </div>
                <canvas id="canvas" class="hidden"></canvas>
            </div>

            <div class="controls-section">
                <div class="control-group">
                    <label for="baseURL">API Endpoint</label>
                    <input id="baseURL" type="text" value="http://localhost:8090" placeholder="Enter your API endpoint">
                </div>

                <div class="control-group">
                    <label for="instructionText">AI Instruction</label>
                    <textarea id="instructionText" placeholder="Describe what you want the AI to analyze in the video feed...">What objects do you see in this image?</textarea>
                </div>

                <div class="interval-control">
                    <label for="intervalSelect">Request Interval:</label>
                    <select id="intervalSelect">
                        <option value="100">100ms</option>
                        <option value="250">250ms</option>
                        <option value="500" selected>500ms</option>
                        <option value="1000">1s</option>
                        <option value="2000">2s</option>
                    </select>
                </div>

                <div class="button-container">
                    <button id="startButton" class="start">Start Detection</button>
                </div>


            </div>
        </div>

        <div class="response-section">
            <div class="response-header">
                <div class="ai-icon">AI</div>
                <h3>AI Response</h3>
                <span class="latency-badge" id="latencyBadge">—</span>
            </div>
            <textarea id="responseText" placeholder="AI analysis will appear here..." readonly></textarea>
        </div>
    </div>

    <script>
        const video = document.getElementById('videoFeed');
        const canvas = document.getElementById('canvas');
        const baseURL = document.getElementById('baseURL');
        const instructionText = document.getElementById('instructionText');
        const responseText = document.getElementById('responseText');
        const intervalSelect = document.getElementById('intervalSelect');
        const startButton = document.getElementById('startButton');
        const videoStatus = document.getElementById('videoStatus');

        let stream;
        let intervalId;
        let isProcessing = false;
        const latencyBadge = document.getElementById('latencyBadge');

        // Uses /completion + image_data — works with newer llama.cpp where --jinja
        // is enabled by default (PR #17524), which breaks /v1/chat/completions + image_url.
        async function sendChatCompletionRequest(instruction, imageDataURL) {
            // Strip "data:image/jpeg;base64," prefix — llama.cpp needs raw base64
            const b64 = imageDataURL.split(',')[1];

            const prompt =
                `<|im_start|>user\n[img-1]\n${instruction}<|im_end|>\n<|im_start|>assistant\n`;

            const t0 = performance.now();
            const response = await fetch(`${baseURL.value}/completion`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    prompt,
                    image_data: [{ data: b64, id: 1 }],
                    max_tokens: 100,
                    temperature: 0.1,
                    stop: ['<|im_end|>', '<|im_start|>'],
                })
            });
            if (!response.ok) {
                const errorData = await response.text();
                return `Server error: ${response.status} - ${errorData}`;
            }
            const data = await response.json();
            const ms = Math.round(performance.now() - t0);
            latencyBadge.textContent = `${ms} ms`;
            return data.content;
        }

        // 1. Ask for camera permission on load
        async function initCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                video.srcObject = stream;
                videoStatus.textContent = "Camera Active";
                responseText.value = "Camera access granted. Ready to start real-time object detection.";
            } catch (err) {
                console.error("Error accessing camera:", err);
                videoStatus.textContent = "Camera Error";
                responseText.value = `Error accessing camera: ${err.name} - ${err.message}. Please ensure permissions are granted and you are on HTTPS or localhost.`;
                alert(`Error accessing camera: ${err.name}. Make sure you've granted permission and you are on HTTPS or localhost.`);
            }
        }

        function captureImage() {
            if (!stream || !video.videoWidth) {
                console.warn("Video stream not ready for capture.");
                return null;
            }
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL('image/jpeg', 0.8);
        }

        async function sendData() {
            if (!isProcessing) return;

            const instruction = instructionText.value;
            const imageBase64URL = captureImage();

            if (!imageBase64URL) {
                responseText.value = "Failed to capture image. Stream might not be active.";
                return;
            }

            try {
                const response = await sendChatCompletionRequest(instruction, imageBase64URL);
                responseText.value = response;
            } catch (error) {
                console.error('Error sending data:', error);
                responseText.value = `Error: ${error.message}`;
            }
        }

        function handleStart() {
            if (!stream) {
                responseText.value = "Camera not available. Cannot start.";
                alert("Camera not available. Please grant permission first.");
                return;
            }
            isProcessing = true;
            startButton.textContent = "Stop Detection";
            startButton.classList.remove('start');
            startButton.classList.add('stop');

            instructionText.disabled = true;
            intervalSelect.disabled = true;
            baseURL.disabled = true;

            videoStatus.textContent = "Detection Active";

            responseText.value = "Real-time object detection started. AI is analyzing video feed...";

            const intervalMs = parseInt(intervalSelect.value, 10);
            
            // Initial immediate call
            sendData(); 
            
            // Then set interval
            intervalId = setInterval(sendData, intervalMs);
        }

        function handleStop() {
            isProcessing = false;
            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
            }
            startButton.textContent = "Start Detection";
            startButton.classList.remove('stop');
            startButton.classList.add('start');

            instructionText.disabled = false;
            intervalSelect.disabled = false;
            baseURL.disabled = false;

            videoStatus.textContent = "Camera Ready";
            
            if (responseText.value.startsWith("Real-time object detection started")) {
                responseText.value = "Detection stopped. Click Start to resume real-time analysis.";
            }
        }

        startButton.addEventListener('click', () => {
            if (isProcessing) {
                handleStop();
            } else {
                handleStart();
            }
        });

        // Initialize camera when the page loads
        window.addEventListener('DOMContentLoaded', initCamera);

        // Optional: Stop stream when page is closed/navigated away to release camera
        window.addEventListener('beforeunload', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            if (intervalId) {
                clearInterval(intervalId);
            }
        });

        // Add some interactive effects
        document.addEventListener('DOMContentLoaded', () => {
            // Add hover effects to control elements
            const controls = document.querySelectorAll('.control-group input, .control-group textarea, .control-group select');
            controls.forEach(control => {
                control.addEventListener('mouseenter', () => {
                    control.style.transform = 'translateY(-2px)';
                });
                control.addEventListener('mouseleave', () => {
                    if (!control.matches(':focus')) {
                        control.style.transform = 'translateY(0)';
                    }
                });
            });
        });
    </script>
</body>
</html>
